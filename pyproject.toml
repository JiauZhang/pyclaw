[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pyclaw"
dynamic = ["version"]
description = "Personal AI Assistant"
readme = "README.md"
authors = [
    {name = "Jiau Zhang", email = "jiauzhang@163.com"},
]
license = {file = "LICENSE"}
classifiers = [
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
keywords = ['Artificial Intelligence']
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "chatchat>=0.4.9",
    "conippets>=0.1.16",
    "chatool>=0.0.2",
    "imchat>=0.0.1",
]

[project.scripts]
pyclaw = "pyclaw.__main__:main"

[project.urls]
Homepage = "https://github.com/jiauzhang/pyclaw"

[tool.hatch.version]
path = "pyclaw/version.py"

[tool.hatch.build.targets.wheel]
packages = ["pyclaw"]
